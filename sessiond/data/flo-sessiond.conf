# /etc/flo-sessiond.conf - flo-sessiond configuration.
# key = value, one per line; "#" starts a comment line. Unknown keys are an
# error. The values below are the built-in defaults: the file may be absent.
# Check a configuration with: flo-sessiond -t [-c FILE]

## Control socket
# With the shipped flo-sessiond.socket unit systemd creates the socket and
# socket_path/socket_group/socket_mode are not used.
socket_path = /run/flo-sessiond.sock
# Group allowed to connect (name or numeric gid). Empty: leave the group alone.
socket_group = flo-session
socket_mode = 0660

# Crash-recovery record of the values to restore. Empty disables it.
state_file = /run/flo-sessiond/state
# error | warning | info | debug
log_level = info

## Touch boost
boost_enabled = yes
# freq:   raise scaling_min_freq of every cpufreq policy
# uclamp: raise cpu.uclamp.min of uclamp_cgroup instead
# both:   do both
boost_mode = freq
boost_freq_khz = 1026000
# How long the boost outlives the last touch event.
boost_hold_ms = 150
# Upper bound for the "boost <ms>" command.
boost_request_max_ms = 3000
cpufreq_root = /sys/devices/system/cpu/cpufreq
# Only for boost_mode uclamp/both: a cgroup directory with cpu.uclamp.min,
# e.g. /sys/fs/cgroup/user.slice (the cpu controller must be enabled there).
uclamp_cgroup =
# Percentage, up to two decimals. 68 ~ 1026 MHz out of 1512 MHz.
uclamp_min = 68

## Touch input
# "auto": the first /dev/input/event* whose name matches input_name (a glob),
# or an explicit device path.
input_device = auto
input_dir = /dev/input
input_name = Elan Touchscreen
# auto: count the hold time from event timestamps when the device accepts
# CLOCK_MONOTONIC stamps; trust: always; ignore: use arrival time.
input_timestamps = auto

## Background app freezer
freezer_enabled = yes
# Only direct children of this directory are ever frozen.
freezer_root = /sys/fs/cgroup/user.slice/user-10000.slice/user@10000.service/app.slice
# Time in the background before an app is frozen.
freezer_grace_ms = 10000
# Unit names (globs) that count as apps. Everything else is never touched.
freezer_match = app-*.scope app-*.service
# Globs on the desktop id (or the whole unit name). If freezer_allow is not
# empty only matching apps are frozen; freezer_deny always wins.
freezer_allow =
freezer_deny = flo-shell* quickshell* *Hyprland* hyprland* *portal* pipewire* wireplumber* *keyboard* wvkbd* squeekboard* dbus* *polkit* *keyring* xdg-*
