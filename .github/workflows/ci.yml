name: ci
on: [push, pull_request]
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y meson ninja-build gcc shellcheck
      - name: flo-sessiond build and tests
        run: meson setup build/sessiond sessiond && meson test -C build/sessiond --print-errorlogs
      - name: install layout
        run: make install DESTDIR="$PWD/build/pkg" PREFIX=/usr
      - name: shellcheck
        run: shellcheck -S warning dev/*.sh
