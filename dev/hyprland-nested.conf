# Minimal Hyprland configuration (classic hyprlang syntax, as on the tablet)
# for running flo-shell in a nested, headless instance: see dev/run-nested.sh.
# No autostart, no effects. Mirrors session/hyprland.conf where it matters.
monitor = FLO, 600x960@60, 0x0, 1

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    layout = monocle
}
decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}
animations {
    enabled = false
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    allow_session_lock_restore = true
}
ecosystem {
    no_update_news = true
    no_donation_nag = true
}
