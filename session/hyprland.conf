# flo-shell session on the Nexus 7 2013 ("flo"): Hyprland configuration.
#
# Classic hyprlang syntax, written for Hyprland 0.54.x as packaged for the
# tablet. Hyprland 0.57 and later only read Lua configuration: this file
# has to be ported before the tablet moves past 0.56.
#
# Installed as /usr/share/flo-shell/session/hyprland.conf and loaded by
# flo-session. To customise, copy it to ~/.config/flo-shell/hyprland.conf.
#
# Design rules (docs/PLAN.md): opaque surfaces, no animations, blur,
# shadows or rounding; one full-screen application at a time.

# ---- Output ---------------------------------------------------------------
# 1200x1920 panel, 323 ppi, integer scale 2 -> 600x960 logical. Rotation is
# applied at run time by the shell (quick settings tile "Rotate"), which
# re-issues this rule with ",transform,N" and sets input:touchdevice:transform.
monitor = DSI-1, preferred, 0x0, 2
monitor = , preferred, auto, 1

# ---- Environment ----------------------------------------------------------
env = QT_QPA_PLATFORM,wayland
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
# Qt Quick scene graph on OpenGL (ES 3.0 on Adreno 320); never Vulkan.
env = QSG_RHI_BACKEND,opengl
env = GDK_BACKEND,wayland
# GTK4: GL renderer (the Vulkan one cannot work on this GPU).
env = GSK_RENDERER,ngl
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = XCURSOR_SIZE,24

# ---- Look: nothing that costs fill rate -----------------------------------
general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    # One window at a time, each using the whole work area. If this
    # Hyprland build does not know "monocle", use "dwindle" and see
    # docs/TESTING.md.
    layout = monocle
    allow_tearing = false
}

decoration {
    rounding = 0
    dim_inactive = false
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}

animations {
    enabled = false
}

# ---- Input ----------------------------------------------------------------
input {
    kb_layout = it
    follow_mouse = 1
    touchdevice {
        output = DSI-1
    }
}

# Finger-following gestures live in the compositor (plan decision 4):
# swipe in from the left or right screen edge to change workspace.
gestures {
    workspace_swipe_touch = true
    workspace_swipe_cancel_ratio = 0.3
    workspace_swipe_create_new = true
}

cursor {
    hide_on_touch = true
    inactive_timeout = 3
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = 0x0f1115
    focus_on_activate = true
    # The shell restarts after a crash and takes the session lock back.
    allow_session_lock_restore = true
    # The power key always brings the panel back, even with a dead shell.
    key_press_enables_dpms = true
    mouse_move_enables_dpms = false
}

xwayland {
    enabled = false
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}

# ---- Hardware keys (power, volume up, volume down) ------------------------
# Flags: l = also while locked, r = on release, o = long press, e = repeat.
# Short press of power: lock and blank, or toggle the panel when locked.
# Held: power menu. The shell ignores the release that follows a long press.
bindrl = , XF86PowerOff, exec, flo-shell msg powerKey
bindlo = , XF86PowerOff, exec, flo-shell msg powerKeyLong
bindel = , XF86AudioRaiseVolume, exec, flo-shell msg volume 5
bindel = , XF86AudioLowerVolume, exec, flo-shell msg volume -5
bindl = , XF86AudioMute, exec, flo-shell msg mute

# ---- Autostart ------------------------------------------------------------
exec-once = flo-shell run
