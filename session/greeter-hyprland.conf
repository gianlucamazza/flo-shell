# Hyprland configuration for the greetd greeter (classic hyprlang syntax,
# Hyprland 0.54.x). Runs the flo-shell greeter and leaves when it is done:
# greetd then starts the session the greeter asked for.
monitor = DSI-1, preferred, 0x0, 2
monitor = , preferred, auto, 1

env = QT_QPA_PLATFORM,wayland
env = QSG_RHI_BACKEND,opengl
# Italian like the session (the system default stays en_US).
env = LANG,it_IT.UTF-8

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
}
decoration {
    rounding = 0
    blur {
        enabled = false
    }
    shadow {
        enabled = false
    }
}
animations {
    enabled = false
}
input {
    kb_layout = it
    touchdevice {
        output = DSI-1
    }
}
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    background_color = 0x0f1115
    key_press_enables_dpms = true
    # hyprland-guiutils is not packaged for armv7 (see hyprland.conf)
    disable_hyprland_guiutils_check = true
}

ecosystem {
    no_update_news = true
    no_donation_nag = true
}
xwayland {
    enabled = false
}
ecosystem {
    no_update_news = true
    no_donation_nag = true
}

exec-once = sh -c 'flo-shell greeter; hyprctl dispatch exit'
